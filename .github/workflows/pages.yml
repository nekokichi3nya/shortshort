name: サイトを公開

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 作品ごとのOGP画像を作るための画像ライブラリとフォント（google/fonts, OFL）
      - run: pip install pillow
      - name: フォントを取得
        run: |
          mkdir -p .fonts && cd .fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSfL --retry 3 -o NotoSerifJP.ttf "$base/notoserifjp/NotoSerifJP%5Bwght%5D.ttf"
          curl -sSfL --retry 3 -O "$base/zenkakugothicnew/ZenKakuGothicNew-Medium.ttf"
          curl -sSfL --retry 3 -O "$base/sharetechmono/ShareTechMono-Regular.ttf"
      - run: python3 scripts/build.py
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
